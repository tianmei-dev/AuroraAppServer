spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

aurora:
  auth:
    session-ttl: 2h
  wechat:
    apps:
      calculator_vault:
        app-id: wx_test_calculator
        app-secret: test-secret-calculator
      speaker_cleaner:
        app-id: wx_test_speaker
        app-secret: test-secret-speaker
  trial:
    hmac-secret: test-trial-hmac-secret-do-not-use-in-prod
    duration: 72h
    rate-limit-per-window: 20
    rate-limit-window: 1m
  payment:
    # FakePaymentProvider lives in src/test only; never configure real Yusen credentials here.
    provider: FAKE
    environment: TEST
    order-ttl: 30m
    reuse-min-remaining: 5m
    order-no-prefix: CV
    notify-confirm-wait: 1s
    jobs:
      # Tests drive PaymentJobService.runCycle() explicitly for deterministic results.
      enabled: false
    yusen:
      # Fictional merchant. Outbound HTTP goes to StubYusenHttpTransport (src/test); the real
      # transport stays disabled.
      gateway-base-url: https://gateway.example.test
      pid: "1001"
      key: fictional-merchant-key-0001
      notify-url: https://api.example.test/api/v1/payment/notify/yusen
      return-url: https://api.example.test/api/v1/payment/return/yusen
      network-enabled: false
