spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

aurora:
  auth:
    session-ttl: 2h
  wechat:
    apps:
      calculator_vault:
        app-id: wx_test_calculator
        app-secret: test-secret-calculator
      speaker_cleaner:
        app-id: wx_test_speaker
        app-secret: test-secret-speaker
  trial:
    hmac-secret: test-trial-hmac-secret-do-not-use-in-prod
    duration: 72h
    rate-limit-per-window: 20
    rate-limit-window: 1m
