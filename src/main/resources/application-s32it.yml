# S3.2 / I3.2-A isolated integration profile.
# Does NOT load application-local.yml. Does NOT touch aurora_app (3308).
# Start: bootRun-s32it.bat  →  http://127.0.0.1:8081
server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:aurora_app_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:test}
    driver-class-name: com.mysql.cj.jdbc.Driver

aurora:
  auth:
    session-ttl: 2h
  wechat:
    apps:
      calculator_vault:
        # Placeholders only — WeChat login is not part of I3.2-A device-trial isolation.
        app-id: ${WECHAT_APP_CALCULATOR_VAULT_APP_ID:wx_s32it_calculator}
        app-secret: ${WECHAT_APP_CALCULATOR_VAULT_APP_SECRET:s32it-placeholder-secret}
  trial:
    # Same non-prod test secret as application-test.yml (IT / I3.2-A isolation).
    hmac-secret: ${TRIAL_HMAC_SECRET:test-trial-hmac-secret-do-not-use-in-prod}
    duration: 72h
    rate-limit-per-window: 30
    rate-limit-window: 1m
