plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aurora'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Isolation fixtures (e.g. I3.4.3-D1) live outside src/main so they never ship in bootJar.
sourceSets {
    fixture {
        java.srcDir 'src/fixture/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('i343d1Fixture', JavaExec) {
    group = 'fixtures'
    description = 'I3.4.3-D1 fixture: -Pi343d1Command=seed|clean (s32it + aurora_app_test only).'
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'com.aurora.appserver.AuroraAppServerApplication'
    workingDir = projectDir
    def command = project.findProperty('i343d1Command') ?: ''
    args '--spring.profiles.active=s32it', '--server.port=0', "--i343d1.command=${command}"
}

tasks.register('verifyBootJarExcludesFixtures') {
    group = 'verification'
    description = 'Fails if test fixtures or fake payment providers are packaged in the production jar.'
    dependsOn tasks.named('bootJar')
    doLast {
        def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile
        def offenders = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().collect { it.name }.findAll {
                it.contains('com/aurora/appserver/fixture/') || it.contains('FakePaymentProvider')
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Production jar contains fixtures: ${offenders}")
        }
        logger.lifecycle("bootJar fixture check OK: ${jarFile.name}")
    }
}

tasks.named('check') {
    dependsOn 'verifyBootJarExcludesFixtures'
}
