plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aurora'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Isolation fixtures (I3.4.3-D1 data, FakePaymentProvider, s32it profile, fake payment control)
// live in src/fixture so they never ship in bootJar. Tests reuse them via the fixture output.
sourceSets {
    fixture {
        java.srcDir 'src/fixture/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.fixture.output
        runtimeClasspath += sourceSets.fixture.output
    }
}

tasks.register('i343d1Fixture', JavaExec) {
    group = 'fixtures'
    description = 'I3.4.3-D1 fixture: -Pi343d1Command=seed|sessions|new-pay-accounts|clean [-Pi343d1Count=3] (s32it + aurora_app_test only).'
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'com.aurora.appserver.AuroraAppServerApplication'
    workingDir = projectDir
    def command = project.findProperty('i343d1Command') ?: ''
    def count = project.findProperty('i343d1Count') ?: '3'
    args '--spring.profiles.active=s32it', '--server.port=0', '--aurora.payment.jobs.enabled=false',
            "--i343d1.command=${command}", "--i343d1.count=${count}"
}

// Standing isolated server on :8081 (s32it + aurora_app_test + FakePaymentProvider).
// Optional -Ps32itExtraArgs="--aurora.payment.order-ttl=2m ..." for short-lived verification runs.
tasks.register('s32itServer', JavaExec) {
    group = 'fixtures'
    description = 'Isolated 8081 server with fixture classpath (never the production jar).'
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'com.aurora.appserver.AuroraAppServerApplication'
    workingDir = projectDir
    def extra = (project.findProperty('s32itExtraArgs') ?: '').toString().trim()
    args(['--spring.profiles.active=s32it'] + (extra ? extra.split(/\s+/).toList() : []))
}

// application.yml has no default profile and ProfileSelectionGuard refuses to start without one.
// bootRun falls back to "local" through the process environment, the lowest-precedence way to set
// it, so --spring.profiles.active, -Dspring.profiles.active and SPRING_APPLICATION_JSON still win.
tasks.named('bootRun') {
    doFirst {
        def explicit = environment.containsKey('SPRING_PROFILES_ACTIVE') ||
                (args ?: []).any { it.startsWith('--spring.profiles.active=') } ||
                allJvmArgs.any { it.startsWith('-Dspring.profiles.active=') }
        if (!explicit) {
            environment('SPRING_PROFILES_ACTIVE', 'local')
            logger.lifecycle('bootRun: no profile specified, defaulting to "local"')
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Production archive safety (B3-03-A2)
//
// Developer-local configuration (application-local.yml holds real dev credentials) stays in
// src/main/resources so bootRun and IDE runs keep working: processResources is NOT filtered.
// Only the packaged archives exclude it, and every archive is verified right after it is built.
// ---------------------------------------------------------------------------------------------
def localOnlyResourcePatterns = [
        '**/application-local*',
        '**/*.local.yml', '**/*.local.yaml', '**/*.local.properties', '**/*.local.json',
        '**/.env', '**/.env.*',
]

// Returns violations (entry names / config key names only — never values).
def productionArchiveViolations = { File archive ->
    def forbiddenNames = [
            ~/(^|\/)application-local[^\/]*$/,
            ~/\.local\.(yml|yaml|properties|json)$/,
            ~/(^|\/)\.env(\.[^\/]*)?$/,
            ~/(^|\/)application-(s32it|test)[^\/]*$/,
            ~/com\/aurora\/appserver\/fixture\//,
            ~/FakePaymentProvider/,
            ~/FixturePaymentControl/,
            ~/StubYusenHttpTransport/,
    ]
    def forbiddenContent = ['fake-key-for-tests-only', 'fictional-merchant-key', 'test-trial-hmac-secret',
                            's32it-placeholder-secret', '/internal/fixture', 'i343d1']
    // Packaged config may reference secrets only through placeholders without literal defaults.
    def secretKeyLine = ~/(?i)^\s*([\w.-]*(password|secret|token|key)[\w.-]*)\s*[:=]\s*(.*?)\s*$/
    def allowedSecretValue = ~/^(|\$\{[A-Z0-9_]+:?\}|\$\{[A-Z0-9_]+:\$\{[A-Z0-9_]+:?\}\})$/
    def violations = []
    new java.util.zip.ZipFile(archive).withCloseable { zip ->
        zip.entries().each { entry ->
            def name = entry.name
            if (forbiddenNames.any { name =~ it }) {
                violations << "forbidden entry: ${name}"
            }
            if (entry.isDirectory()) {
                return
            }
            boolean ownClassOrResource = name.startsWith('BOOT-INF/classes/') || !name.startsWith('BOOT-INF/')
            if (!ownClassOrResource || name.startsWith('META-INF/MANIFEST') || name.startsWith('org/springframework/boot/loader/')) {
                return
            }
            def text = zip.getInputStream(entry).withCloseable { new String(it.readAllBytes(), 'ISO-8859-1') }
            forbiddenContent.findAll { text.contains(it) }.each { violations << "forbidden test marker in ${name}: '${it}'" }
            if (name ==~ /.*\.(yml|yaml|properties)$/) {
                text.readLines().eachWithIndex { line, idx ->
                    def m = line =~ secretKeyLine
                    if (m.matches() && !line.trim().startsWith('#')) {
                        def value = m.group(3).replaceAll(/\s+#.*$/, '').replaceAll(/^["']|["']$/, '').trim()
                        if (!(value ==~ allowedSecretValue)) {
                            violations << "literal secret value in ${name}:${idx + 1} (key '${m.group(1)}')"
                        }
                    }
                }
            }
        }
    }
    return violations
}

def verifyProductionArchive = { File archive, boolean deleteOnFailure ->
    def violations = productionArchiveViolations(archive)
    if (!violations.isEmpty()) {
        if (deleteOnFailure) {
            archive.delete()
        }
        throw new GradleException("Production archive safety check FAILED for ${archive.name}"
                + (deleteOnFailure ? " (archive deleted)" : "") + ":\n  - " + violations.join("\n  - "))
    }
}

tasks.named('bootJar') {
    exclude(localOnlyResourcePatterns)
    doLast {
        def archive = archiveFile.get().asFile
        verifyProductionArchive(archive, true)
        logger.lifecycle("Production archive safety check OK: ${archive.name}")
    }
}

tasks.named('jar') {
    exclude(localOnlyResourcePatterns)
    doLast {
        def archive = archiveFile.get().asFile
        verifyProductionArchive(archive, true)
        logger.lifecycle("Production archive safety check OK: ${archive.name}")
    }
}

// Explicit re-check (also wired into `check`). -PverifyArchive=<path> checks any archive without deleting it.
tasks.register('verifyBootJarExcludesFixtures') {
    group = 'verification'
    description = 'Fails if local config, fixtures, fake payment code, test markers or literal secrets are in a production archive.'
    dependsOn tasks.named('bootJar')
    def projectDirFile = projectDir
    def requestedArchive = providers.gradleProperty('verifyArchive')
    def bootJarArchive = tasks.named('bootJar').flatMap { it.archiveFile }
    doLast {
        def archive = requestedArchive.isPresent()
                ? new File(requestedArchive.get()).with { it.absolute ? it : new File(projectDirFile, it.path) }
                : bootJarArchive.get().asFile
        verifyProductionArchive(archive, false)
        logger.lifecycle("bootJar fixture check OK: ${archive.name}")
    }
}

tasks.named('check') {
    dependsOn 'verifyBootJarExcludesFixtures'
}
